version: '3.8'

services:
  # Backend API (Production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runner
    container_name: estoque-cris-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL}
      NEON_AUTH_JWKS_URL: ${NEON_AUTH_JWKS_URL}
      NEON_AUTH_AUDIENCE: ${NEON_AUTH_AUDIENCE:-neondb}
      NEON_AUTH_ISSUER: ${NEON_AUTH_ISSUER}
      PORT: 5000
      API_PREFIX: api/v1
      CORS_ORIGIN: ${CORS_ORIGIN:-https://estoque-cris.com}
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (Nginx Production)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runner
    container_name: estoque-cris-frontend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api.estoque-cris.com/api/v1}
    ports:
      - "80:80"
      - "443:443"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Redis (Production)
  redis:
    image: redis:7-alpine
    container_name: estoque-cris-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:

networks:
  default:
    name: estoque-cris-prod-network